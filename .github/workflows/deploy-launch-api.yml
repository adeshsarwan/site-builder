name: Deploy Launch API

on:
  push:
    branches: [main]
    paths: ['apps/launch-api/**', '.github/workflows/deploy-launch-api.yml']
  workflow_dispatch:

concurrency:
  group: deploy-launch-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/launch-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/launch-api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # D1 database is auto-provisioned on first deploy (no database_id in wrangler.jsonc).
      - run: npx wrangler deploy --var CF_ACCOUNT_ID:${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler d1 migrations apply launch-db --remote
