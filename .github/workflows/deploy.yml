name: Deploy sites
# The Launch API finds its run by this name, so keep `inputs.run_key` in it.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('deploy {0} {1}', inputs.site, inputs.run_key) || format('deploy changed sites @ {0}', github.sha) }}

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'sites/**', '.github/workflows/deploy.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      site:
        description: 'Folder under /sites (e.g. jobsthe-world), or "all"'
        required: true
        type: string
      run_key:
        description: 'Correlation id (set by the Launch API)'
        required: false
        default: manual
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-${{ inputs.site || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.plan.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: plan
        run: node .github/scripts/changed-sites.mjs
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SITE: ${{ inputs.site }}
          BEFORE: ${{ github.event.before }}

  deploy:
    needs: plan
    if: needs.plan.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJson(needs.plan.outputs.sites) }}
    defaults:
      run:
        working-directory: apps/web
    env:
      SITE: ${{ matrix.site }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JOBS_API_BASE: ${{ secrets.JOBS_API_BASE }}
      JOBS_API_KEY: ${{ secrets.JOBS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Fill missing article photos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/fill-images.mjs
      - name: Build ${{ matrix.site }}
        run: node scripts/prepare-site.mjs && npx astro build
      - name: Deploy Worker site-${{ matrix.site }}
        run: npx wrangler deploy
      - name: Save new photos to the repo
        working-directory: .
        run: |
          git add "sites/$SITE" 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "site-builder bot"; git config user.email "actions@users.noreply.github.com"
          git commit -m "Add article photos for $SITE [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          echo "::warning::Could not push photos (they are live in this deploy; the next deploy will retry)"
      - name: Set jobs API secrets
        if: ${{ env.JOBS_API_BASE != '' }}
        run: |
          node -e 'console.log(JSON.stringify({JOBS_API_BASE:process.env.JOBS_API_BASE,JOBS_API_KEY:process.env.JOBS_API_KEY||""}))' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json --name "site-$SITE"
          rm /tmp/secrets.json
