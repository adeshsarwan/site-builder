name: Games site deploy
run-name: deploy ${{ inputs.site }}

# Shows a games site's recent Pages builds, then rebuilds it now (POST /deploy, which also brings the project's
# build watch paths up to date) and waits for the result. Needs the LAUNCH_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site key or domain, e.g. vulirox.site'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.LAUNCH_API_KEY }}
      SITE: ${{ inputs.site }}
      API: https://sitebuilder.thebesads.com/api/v1/games/sites
    steps:
      - name: Recent builds, rebuild, wait
        run: |
          echo "Recent builds:"
          curl -sS "$API/$SITE/deployments" -H "Authorization: Bearer $KEY" | jq -r '.deployments[]? | "\(.createdOn)\t\(.status)\t\(.stage)\t\(.commit // "" | .[0:7])"'
          D=$(curl -sS -X POST "$API/$SITE/deploy" -H "Authorization: Bearer $KEY")
          echo "$D" | jq .
          ID=$(echo "$D" | jq -r .deploymentId)
          [ "$ID" != "null" ] || exit 1
          for i in $(seq 1 30); do
            S=$(curl -sS "$API/$SITE/deployments?id=$ID" -H "Authorization: Bearer $KEY")
            ST=$(echo "$S" | jq -r .status); echo "$ST $(echo "$S" | jq -r .stage)"
            [ "$ST" = success ] && exit 0
            [ "$ST" = failure ] || [ "$ST" = canceled ] && { echo "$S" | jq .; exit 1; }
            sleep 20
          done
          exit 1
